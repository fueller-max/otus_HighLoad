 
    - name: Install Nginx and PHP packages
      ansible.builtin.apt: 
        name:
          - nginx
          - php-fpm
          - php-mysql
          - php-curl
          - php-gd
          - php-mbstring
          - php-xml
          - php-xmlrpc
          - php-soap
          - php-intl
          - php-zip
        state: present
      tags: [always] 

