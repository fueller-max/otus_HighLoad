---
#tasks file for mysql-router
- name: Install MySQL Router
  apt:
    name: mysql-router
    state: present
  when: ansible_os_family == "Debian"


- name: Create a user mysql no login shell
  ansible.builtin.user:
    name: mysql
    shell: /usr/sbin/nologin
    state: present
    createhome: false 

- name: Create MySQL Router directories
  file:
    path: "{{ item }}"
    state: directory
    owner: mysql
    group: mysql
    mode: '0777'
  loop:
    - "{{ router_config_dir }}"
    - "{{ router_log_dir }}"
    - "{{ router_data_dir }}"
 

