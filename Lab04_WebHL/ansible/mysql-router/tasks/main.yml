- name: Copy custom MySQL Router configuration template
  template:
    src: mysqlrouter.conf.j2
    dest: "{{ router_data_dir }}/mysqlrouter.conf"
    owner: mysql
    group: mysql
    mode: '0644'

- name: Ensure MySQL Router service is started and enabled
  systemd:
    name: mysqlrouter
    state: started
    enabled: yes