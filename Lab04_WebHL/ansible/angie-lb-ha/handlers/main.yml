# handlers file for angie-lb
- name: Restart Angie
  systemd:
     name: angie
     state: restarted

- name: Restart rsync
  systemd:
     name: rsync
     state: restarted    


- name: Restart Keepalived
  systemd:
     name: keepalived
     state: restarted 
      