- name: Render filebeat main config 
  ansible.builtin.template:
      src:  templates/filebeat.yml.j2      
      dest: /etc/filebeat/filebeat.yml  
      owner: root                           
      group: root                           
      mode: '0644'      
  tags: [always]  


- name: Start and enable Filebeat 
  ansible.builtin.systemd:
    name: filebeat
    state: started
    enabled: yes 
  tags: [always]