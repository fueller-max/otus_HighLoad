- name: Install & Provision Elastic Search
  hosts: es
  become: true
  roles:
        - role: elastic-search 

- name: Install & Provision Kafka
  hosts: kafka
  become: true
  roles:
        - role: kafka 
        
- name: Install & Pre-Provision Kibana
  hosts: kibana
  become: true
  roles:
        - role: kibana    

- name: Install & Provision Logstash
  hosts: logstash
  become: true
  roles:
        - role: logstash            