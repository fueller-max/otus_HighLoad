# tasks file for logstash
- name: Install Logstash
  tags: install
  ansible.builtin.include_tasks: 
    file: install.yaml
  when: ansible_facts["os_family"] == "Debian"

- name: Provision Logstash
  tags: provision
  ansible.builtin.include_tasks: 
   file: provision.yaml
  when: ansible_facts["os_family"] == "Debian"